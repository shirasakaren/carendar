name: carendar

services:
  db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mgm_calendar}
    volumes:
      - carendar_db:/var/lib/postgresql/data
    ports:
      # Override the host-side port if 5432 is taken on the host, e.g.
      # POSTGRES_PORT=5433. The container always listens on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgm} -d ${POSTGRES_DB:-mgm_calendar}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      MIGRATIONS_PATH: /app/migrations
      DATABASE_URL: ${DATABASE_URL:-postgres://mgm:mgm_dev_password@db:5432/mgm_calendar?sslmode=disable}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-bytes}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-8}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the client bundle. Browser hits this URL directly,
        # so it must be reachable from the user's machine (typically the
        # backend's published port: http://localhost:8080).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

volumes:
  carendar_db:
