name: CI

# Runs on every PR and every push. Pure verification — no images are
# published from here; `staging` / `production` own the deploy workflows.

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
  workflow_dispatch:


jobs:
  backend:
    name: backend · vet · build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test -race -timeout 5m ./...

  backend-docker:
    name: backend · docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: carendar-backend:ci
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci

