name: production

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  ENVIRONMENT: production

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-image:
    name: backend image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — push steps will be skipped."
          fi

      - name: Login to Docker Hub
        if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-backend:latest-${{ steps.meta.outputs.ts }}
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-backend:latest-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    name: frontend image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || 'http://localhost:8080' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — push steps will be skipped."
          fi

      - name: Login to Docker Hub
        if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-frontend:latest-${{ steps.meta.outputs.ts }}
            ${{ vars.DOCKERHUB_USERNAME }}/carendar-frontend:latest-${{ steps.meta.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
