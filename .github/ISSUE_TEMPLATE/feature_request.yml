name: Feature request
description: Suggest an idea for the calendar or the admin panel.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the feature you'd like to see. The more context the better.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this feature address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've thought about.
  - type: dropdown
    id: area
    attributes:
      label: Which app would this touch?
      options:
        - Frontend (calendar / admin UI)
        - Backend (API)
        - Both
        - Other (CI, docker, docs)
    validations:
      required: true
